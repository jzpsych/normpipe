    - {id: grandiosity, items: [187, 197]}
    - {id: irresponsibility, items: [129, 160]}
    - {id: impulsivity, items: [4, 17]}
    - {id: distractibility, items: [6, 132]}
    - {id: unusual_beliefs, items: [194, 209]}
    - {id: eccentricity, items: [25, 185]}
    - {id: percept_dysreg, items: [44, 77]}
    - {id: perseveration, items: [60, 128]}
    - {id: rigid_perfect, items: [123, 176]}
