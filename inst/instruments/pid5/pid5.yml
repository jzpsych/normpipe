# PID-5 family: configuration for normpipe, transcribed from the scoring keys
# of the Zenodo pipeline (pid5_norming_pipeline.R, Section 1: facet_key,
# domain_key, sf_facet_key, bf_domain_key, bfplus_facet_key,
# bfplus_domain_key, bfplusm_anankastia_doublets, reverse_items).
#
# Versions: full (PID-5, 220 items), sf (PID-5-SF, 100 items), bf (PID-5-BF,
# 25 items), bfplus (PID5BF+, 34 items: 17 facet doublets and the five DSM
# domains), bfplus_m (PID5BF+M: Anankastia from three doublets and the
# 30-item total). Facets are item means (GRM), domains are means of the three
# primary facet means (bifactor, one specific factor per facet), totals are
# item means over the five DSM domains (composite route over the component
# models). Short-form facets and domains use the item parameters of the full
# calibration restricted to their items (calibrate_from). PID5BF+ domains and
# PID5BF+M Anankastia are calibrated as bifactor models with three two-item
# specific factors whose slopes are constrained equal within a doublet
# (equal_block_slopes), as in stage M3f of the original pipeline.
#
# Reference sample (GESIS): only the 34 bridge items are observed, so the
# PID5BF+ scales and the PID5BF+M scales take the direct route and everything
# else needs the transfer module (M2). The mapping of the GESIS variables
# gecl153a..gecl186a to item numbers is in gesis_bridge_map.csv.
